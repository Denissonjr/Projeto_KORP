global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "http-server-projeto-korp"
    metrics_path: /metrics
    static_configs:
      - targets: ["http-server-projeto-korp:8080"]
        labels:
          service: "http-server-projeto-korp"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
