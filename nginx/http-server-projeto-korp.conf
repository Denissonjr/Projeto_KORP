# Proxy reverso do NGINX para o http-server-projeto-korp.
# Requisições feitas a http://localhost:80 são encaminhadas ao serviço
# http-server-projeto-korp, escutando na porta 8080 dentro da rede Docker.

server {
    listen 80;
    server_name localhost;

    # Endpoint principal da aplicação
    location /projeto-korp {
        proxy_pass http://http-server-projeto-korp:8080/projeto-korp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de disponibilidade (liveness)
    location /health {
        proxy_pass http://http-server-projeto-korp:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Métricas Prometheus (opcionalmente exposto via proxy também)
    location /metrics {
        proxy_pass http://http-server-projeto-korp:8080/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
