---
# playbook.yml
#
# Provisiona, de ponta a ponta, o ambiente do desafio Projeto Korp:
#   1) Instala e configura o Docker
#   2) Cria a rede Docker em modo bridge
#   3) Copia o código-fonte do serviço e os arquivos de infraestrutura
#   4) Builda a imagem do http-server-projeto-korp
#   5) Sobe os containers (app, nginx, prometheus, grafana) via Docker Compose
#   6) Configura o NGINX como proxy reverso
#   7) Configura o Prometheus e o Grafana (provisioning automático de
#      datasource e dashboard)
#   8) Valida o funcionamento fazendo uma requisição HTTP real e imprime
#      a resposta no console
#
# Uso (um único comando):
#   ansible-playbook -i inventory.ini playbook.yml
#
# Pré-requisitos no control node: Ansible >= 2.14. O playbook usa somente
# módulos ansible.builtin, sem depender de collections externas.

- name: Provisionamento do ambiente Projeto Korp
  hosts: korp_servers
  become: true
  gather_facts: true

  vars:
    project_dest: /opt/projeto-korp
    docker_network_name: korp-network
    validation_url: "http://localhost/projeto-korp"

  tasks:

    # ------------------------------------------------------------------
    # 1) Instalação e configuração do Docker
    # ------------------------------------------------------------------
    - name: Atualizar cache de pacotes apt
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Instalar dependências para o repositório oficial do Docker
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present
      when: ansible_os_family == "Debian"

    - name: Criar diretório para chaves apt (keyrings)
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"
      when: ansible_os_family == "Debian"

    - name: Baixar chave GPG oficial do Docker
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/ubuntu/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false
      when: ansible_os_family == "Debian"

    - name: Adicionar repositório apt oficial do Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
        state: present
        filename: docker
      when: ansible_os_family == "Debian"

    - name: Instalar Docker Engine, CLI e plugin do Compose
      ansible.builtin.apt:
        update_cache: true
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
      when: ansible_os_family == "Debian"

    - name: Garantir que o serviço Docker esteja ativo e habilitado no boot
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Adicionar o usuário de conexão ao grupo docker (uso sem sudo)
      ansible.builtin.user:
        name: "{{ ansible_user_id }}"
        groups: docker
        append: true
      when: ansible_user_id != "root"

    # ------------------------------------------------------------------
    # 2) Cópia dos arquivos do projeto para o host de destino
    # ------------------------------------------------------------------
    - name: Criar diretório do projeto no host de destino
      ansible.builtin.file:
        path: "{{ project_dest }}"
        state: directory
        mode: "0755"

    - name: Copiar código-fonte e infraestrutura do projeto
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ project_dest }}/"
        mode: preserve
      loop:
        - http-server-projeto-korp
        - nginx
        - prometheus
        - grafana
        - docker-compose.yml

    # ------------------------------------------------------------------
    # 3) Criação da rede Docker em modo bridge
    # ------------------------------------------------------------------
    - name: Verificar se a rede Docker já existe
      ansible.builtin.command: "docker network inspect {{ docker_network_name }}"
      register: network_check
      changed_when: false
      failed_when: false

    - name: Criar rede Docker em modo bridge
      ansible.builtin.command: "docker network create --driver bridge {{ docker_network_name }}"
      when: network_check.rc != 0

    # ------------------------------------------------------------------
    # 4) Build da imagem e execução dos containers via Docker Compose
    #    (aplicação, NGINX, Prometheus e Grafana)
    # ------------------------------------------------------------------
    - name: Build da imagem do http-server-projeto-korp via Docker Compose
      ansible.builtin.command: docker compose build
      args:
        chdir: "{{ project_dest }}"

    - name: Subir os containers (app, nginx, prometheus, grafana)
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ project_dest }}"

    # ------------------------------------------------------------------
    # 5) Validação: requisição HTTP real ao serviço via NGINX
    # ------------------------------------------------------------------
    - name: Aguardar o serviço responder através do proxy NGINX
      ansible.builtin.uri:
        url: "{{ validation_url }}"
        method: GET
        status_code: 200
        return_content: true
      register: validation_result
      retries: 15
      delay: 3
      until: validation_result.status is defined and validation_result.status == 200

    - name: Exibir a resposta do endpoint /projeto-korp no console
      ansible.builtin.debug:
        msg: "Resposta do http-server-projeto-korp: {{ validation_result.content }}"

    - name: Exibir informações de acesso ao ambiente
      ansible.builtin.debug:
        msg:
          - "Serviço:    curl http://localhost/projeto-korp"
          - "Prometheus: http://localhost:9090"
          - "Grafana:    http://localhost:3000  (usuário/senha: admin/admin)"
