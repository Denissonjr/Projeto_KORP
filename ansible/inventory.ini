# Por padrão, provisiona a própria máquina onde o Ansible é executado.
# Para provisionar um host remoto, comente a linha "localhost" abaixo e
# descomente/edite o exemplo de host remoto com IP, usuário SSH e chave.
[korp_servers]
localhost ansible_connection=local

# korp01 ansible_host=192.168.0.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa
